<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dhabalogy Menu</title>
  <meta name="description" content="Dhabalogy — explore the menu, find your favourites and build your selection.">
  <meta name="theme-color" content="#075B55">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700&family=Yatra+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="i-lotus" viewBox="0 0 64 44">
      <path fill="#075B55" d="M6 34c8 7 18 10 26 10s18-3 26-10c-8-2-17-2-26 1-9-3-18-3-26-1z"/>
      <path fill="#EF8078" d="M32 38C22 34 14 26 12 14c8 2 14 8 20 18 6-10 12-16 20-18-2 12-10 20-20 24z"/>
      <path fill="#BD381B" d="M32 38c-7-7-9-18-5-32 2 3 4 6 5 10 1-4 3-7 5-10 4 14 2 25-5 32z"/>
      <path fill="#F4C44E" d="M32 38c-3-3-4-8-3-13 1 2 2 4 3 7 1-3 2-5 3-7 1 5 0 10-3 13z"/>
      <circle fill="#F4C44E" cx="4" cy="26" r="2"/><circle fill="#F4C44E" cx="60" cy="26" r="2"/>
    </symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="m16.5 16.5 5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M6 12h12" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 6v12M6 12h12" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h13m-5-6 6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H6m5 6-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M5 7h14M10 11v6M14 11v6M7 7l1 12h8l1-12M9 7V4h6v3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </defs>
</svg>

<div class="app" id="app">

  <!-- ============ Screen 1: Welcome ============ -->
  <section class="screen welcome" id="screen-welcome" aria-labelledby="welcome-title">
    <div class="welcome-art">
      <img class="welcome-logo" src="assets/logo.png" width="505" height="140" alt="Dhabalogy" fetchpriority="high">
      <img class="welcome-ornament" src="assets/ornament.jpg" width="640" height="90" alt="" aria-hidden="true">
      <img class="welcome-dancers" src="assets/dancers.jpg" width="900" height="662" alt="Two dandiya dancers in painted folk-art style" fetchpriority="high">
    </div>
    <div class="welcome-panel">
      <h1 class="display welcome-title" id="welcome-title">Aao, kuch achha khaate hain.</h1>
      <p class="welcome-sub">Explore the menu. Find your favourites.</p>
      <a class="btn btn-primary btn-lg" href="#menu" id="explore-btn">Explore Menu</a>
      <p class="welcome-foot" id="welcome-address"></p>
    </div>
    <div class="check-stripe" aria-hidden="true"></div>
  </section>

  <!-- ============ Screen 2: Menu ============ -->
  <section class="screen menu" id="screen-menu" hidden>
    <header class="topbar">
      <a class="topbar-logo" href="#" aria-label="Dhabalogy — back to welcome">
        <img src="assets/logo.png" width="505" height="140" alt="Dhabalogy">
      </a>
      <button class="icon-btn" type="button" id="search-jump" aria-label="Search the menu">
        <svg class="icon"><use href="#i-search"/></svg>
      </button>
    </header>

    <div class="searchwrap">
      <label class="search">
        <svg class="icon search-icon" aria-hidden="true"><use href="#i-search"/></svg>
        <input type="search" id="search" placeholder="Search dishes, e.g. paneer, chai, paratha" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="Search dishes by name" enterkeyhint="search">
        <button class="search-clear" type="button" id="search-clear" aria-label="Clear search" hidden>
          <svg class="icon"><use href="#i-close"/></svg>
        </button>
      </label>
    </div>

    <nav class="chips" id="chips" aria-label="Menu categories"></nav>

    <main id="menu-content" class="menu-content"></main>

    <section id="search-results" class="search-results" aria-live="polite" hidden></section>

    <div class="menu-end" aria-hidden="true">
      <div class="divider"><span></span><svg class="lotus"><use href="#i-lotus"/></svg><span></span></div>
      <p class="display">Shukriya, phir aana.</p>
    </div>
  </section>

  <!-- Floating category control -->
  <button class="fab" type="button" id="fab-categories" hidden>
    <svg class="icon"><use href="#i-list"/></svg> Categories
  </button>

  <!-- Persistent selection bar -->
  <div class="selbar" id="selbar" hidden>
    <div class="selbar-text" aria-live="polite">
      <strong id="selbar-count">0 dishes</strong>
      <span id="selbar-total">₹0</span>
    </div>
    <button class="btn btn-onred" type="button" id="selbar-view">View Selection <svg class="icon"><use href="#i-arrow"/></svg></button>
  </div>

  <!-- Sheets -->
  <div class="backdrop" id="backdrop"></div>

  <section class="sheet sheet-dish" id="sheet-dish" role="dialog" aria-modal="true" aria-labelledby="dish-title" aria-hidden="true" tabindex="-1">
    <button class="sheet-close icon-btn" type="button" data-close aria-label="Close dish details"><svg class="icon"><use href="#i-close"/></svg></button>
    <div class="sheet-body" id="dish-body"></div>
    <div class="sheet-foot" id="dish-foot"></div>
  </section>

  <section class="sheet sheet-selection" id="sheet-selection" role="dialog" aria-modal="true" aria-labelledby="selection-title" aria-hidden="true" tabindex="-1">
    <header class="sheet-head">
      <div class="sheet-handle" aria-hidden="true"></div>
      <h2 class="display sheet-title" id="selection-title">Your Selection</h2>
      <button class="sheet-close icon-btn" type="button" data-close aria-label="Close selection"><svg class="icon"><use href="#i-close"/></svg></button>
    </header>
    <div class="sheet-body" id="selection-body"></div>
    <div class="sheet-foot" id="selection-foot"></div>
  </section>

  <section class="sheet sheet-categories" id="sheet-categories" role="dialog" aria-modal="true" aria-labelledby="categories-title" aria-hidden="true" tabindex="-1">
    <header class="sheet-head">
      <div class="sheet-handle" aria-hidden="true"></div>
      <h2 class="display sheet-title" id="categories-title">Categories</h2>
      <button class="sheet-close icon-btn" type="button" data-close aria-label="Close categories"><svg class="icon"><use href="#i-close"/></svg></button>
    </header>
    <div class="sheet-body" id="categories-body"></div>
  </section>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<script src="js/menu-data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
